name: bottle

# Run after a formula's version has been bumped and pushed:
#   gh workflow run bottle.yml -f formula=pkginbox
# Deliberately not triggered by the push itself — this workflow commits the
# bottle block back to main, which would set the next run going.
on:
  workflow_dispatch:
    inputs:
      formula:
        description: Formula to bottle
        required: true
        type: string

permissions:
  contents: write

env:
  TAP: swchck/tap

jobs:
  # arm64 only. Intel macOS is a Tier 3 configuration for Homebrew, with no
  # bottles even for rust, so bottling there would mean compiling LLVM first.
  # An Intel machine builds this formula from source, which works fine.
  bottle:
    runs-on: macos-15
    steps:
      - uses: Homebrew/actions/setup-homebrew@main

      # The tap is cloned from the remote rather than linked to a checkout:
      # the runner's workspace can sit inside the Homebrew repository, and a
      # symlink between the two turns into a loop.
      - name: Tap
        run: |
          brew tap "$TAP" "https://github.com/${{ github.repository }}"
          brew trust --tap "$TAP"

      - name: Build the bottle
        run: |
          name="$TAP/${{ inputs.formula }}"
          version="$(brew info --json=v2 "$name" | jq -r '.formulae[0].versions.stable')"
          root="https://github.com/${{ github.repository }}/releases/download/${{ inputs.formula }}-$version"
          brew install --build-bottle "$name"
          brew bottle --json --no-rebuild --root-url="$root" "$name"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Write the bottle block into the formula
        run: brew bottle --merge --write --no-commit *.bottle.json

      - name: Publish the bottles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # brew writes `name--version`; the URL in the bottle block has one dash
          for file in *.bottle.tar.gz; do
            mv "$file" "${file/--/-}"
          done
          gh release create "${{ inputs.formula }}-$VERSION" *.bottle.tar.gz \
            --repo "${{ github.repository }}" \
            --title "${{ inputs.formula }} $VERSION" \
            --notes "Bottles for ${{ inputs.formula }} $VERSION"

      - name: Commit the bottle block
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$(brew --repository "$TAP")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin \
            "https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}"
          git commit -am "chore: bottle ${{ inputs.formula }} $VERSION"
          git push origin HEAD:main
